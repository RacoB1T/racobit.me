        <button id="music-list-toggle" type="button" aria-expanded="false" aria-controls="music-playlist" title="打开或关闭歌单" aria-label="打开或关闭歌单" data-ruri-label="list_toggle"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h13M3 10h10M3 15h7M18 10v9m0-9 4-1v7"/><ellipse cx="15.5" cy="19" rx="2.5" ry="2"/></svg></button>

  <div id="music-volume-panel" hidden><button id="music-mute" type="button" aria-label="静音" data-ruri-label="mute" title="静音" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z"/><path class="volume-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="volume-cross" d="m16 9 5 6m0-6-5 6"/></svg></button><input id="music-volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量" data-ruri-label="volume"><output id="music-volume-value" for="music-volume">100%</output></div>

<a class="back-top" href="#top" aria-label="返回最上" title="返回最上"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></a><template id="ruri-toc-template"><div class="toc-head"><span class="toc-head-title">文章目录</span><button type="button" class="toc-close" aria-label="关闭">×</button></div></template><script> 
(()=>{
const narrow=matchMedia('(max-width:760px)');
document.documentElement.classList.toggle('mobile-ui',narrow.matches);


function hasContents(){
  const source=document.querySelector('.reading-sidebar .toc');
  return !!(source&&source.textContent.trim());
}
function buildTocToggle(){
  const button=document.getElementById('toc-toggle');
  return button&&hasContents()?button:null;
}
function buildTocDrawer(){
  const existing=document.getElementById('ruri-toc');if(existing)return existing;
  const aside=document.querySelector('.reading-sidebar');if(!aside)return null;
  

  const toc=aside.querySelector('.toc');if(!toc||!toc.textContent.trim())return null;
  const template=document.getElementById('ruri-toc-template');if(!template)return null;
  const drawer=document.createElement('aside');
  drawer.id='ruri-toc';drawer.className='toc-drawer';
  drawer.setAttribute('aria-label',aside.getAttribute('aria-label')||document.title);drawer.hidden=true;
  

  toc.querySelectorAll('details').forEach(item=>{item.open=true});
   
  const jump=aside.querySelector('.comments-jump');
  drawer.append(template.content.cloneNode(true));
  drawer.append(toc);if(jump)drawer.append(jump);
  document.body.append(drawer);
  return drawer;
}


function dropTocDrawer(){
  uiAbort?.abort();uiAbort=null;
  document.getElementById('ruri-toc')?.remove();
  document.body.classList.remove('toc-open');
  document.documentElement.classList.remove('toc-drawer-active');
  drawerApi=null;
}


function teardownToc(){
  const drawer=document.getElementById('ruri-toc');
  const aside=document.querySelector('.reading-sidebar');
  if(drawer){
    const toc=drawer.querySelector('.toc');
    if(toc&&aside){
       
      toc.querySelectorAll('details').forEach(item=>{item.open=false});
      aside.append(toc);
    }
    const jump=drawer.querySelector('.comments-jump');
    if(jump&&aside)aside.append(jump);
  }
  dropTocDrawer();
}
let drawerApi=null,uiAbort=null,activeShell=null;
function initMobileUi(){
  const shell=document.getElementById('page-shell');
  

  if(narrow.matches&&shell&&shell===activeShell&&document.getElementById('ruri-toc'))return;
  activeShell=shell;
  if(!narrow.matches){teardownToc();return}
  

  const button=buildTocToggle();
  if(!button){dropTocDrawer();return}
  const drawer=buildTocDrawer();
  if(!drawer)return;
  document.documentElement.classList.add('toc-drawer-active');
  const setOpen=open=>{
    if(open===drawer.classList.contains('is-open'))return;
    if(open&&drawer.hidden){drawer.hidden=false;void drawer.offsetWidth}
    drawer.classList.toggle('is-open',open);
    document.body.classList.toggle('toc-open',open);
    button.setAttribute('aria-expanded',String(open));
    if(open){drawer.hidden=false;drawer.querySelector('.toc-close')?.focus()}
    else drawer.addEventListener('transitionend',()=>{if(!drawer.classList.contains('is-open'))drawer.hidden=true},{once:true});
  };
  if(!uiAbort){
    uiAbort=new AbortController();const signal=uiAbort.signal;
    button.addEventListener('click',()=>drawerApi.open(),{signal});
    drawer.querySelector('.toc-close')?.addEventListener('click',()=>{drawerApi.close();button.focus()},{signal});
    drawer.addEventListener('click',event=>{if(event.target.closest('a'))drawerApi.close()},{signal});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&drawer.classList.contains('is-open'))drawerApi.close()},{signal});
    document.addEventListener('click',event=>{
      if(!drawer.classList.contains('is-open'))return;
      if(!drawer.contains(event.target)&&!button.contains(event.target))drawerApi.close();
    },{signal});
  }
  drawerApi={open:()=>setOpen(true),close:()=>setOpen(false)};
}


function refresh(){
  if(document.getElementById('page-shell')===activeShell)return;
  dropTocDrawer();
  initMobileUi();
}
window.RuriMobileUi={refresh};
document.addEventListener('DOMContentLoaded',initMobileUi);
addEventListener('pageshow',initMobileUi);
narrow.addEventListener('change',event=>{document.documentElement.classList.toggle('mobile-ui',event.matches);drawerApi?.close();initMobileUi()});
})();</script></body></html>
